<div class="container px-4 py-5 p-md-5">
  <div class="text-center">
    <h1 class="section-title">Experiences</h1>
  </div>
  <!-- Title -->
  <div class="row text-center py-3 py-md-4">
    {% for experience in site.data.home.featured_experiences %}
    <div class="col-12 col-md-4 px-0 py-3 px-md-2 py-md-0">
      <div class="card mx-auto company-card">
        <div class="company-logo d-flex">
          <img class="card-img-top" src="{{ experience.logo | relative_url }}" alt="{{ experience.title }} logo">
        </div>
        <div class="card-body">
          <h5 class="card-title job-title">{{ experience.title }}</h5>
          <p class="card-text">{{ experience.description }}</p>
          <a href="{{ experience.url }}" class="general-button">{{ experience.cta }}</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
