{%- assign block = page.project_detail_generated.blocks[include.block_id] -%}
<div class="project-gallery project-collection project-collection--{{ block.layout | escape }}" data-gallery-layout="{{ block.layout | escape }}">
  {%- for item in block.items -%}
  <figure class="project-gallery-item project-collection-item">
    {%- include pages/project-detail/blocks/primitives/media-frame.html image=item.image -%}
    {%- if item.caption -%}
      {%- include pages/project-detail/blocks/primitives/caption.html caption=item.caption -%}
    {%- endif -%}
  </figure>
  {%- endfor -%}
</div>
