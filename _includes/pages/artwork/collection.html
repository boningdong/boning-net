<section class="artwork-collection design-wrap" aria-labelledby="artwork-collection-title">
  <div class="section-head-row artwork-collection-head">
    <div>
      <span class="section-kicker">The archive</span>
      <h2 class="section-heading" id="artwork-collection-title">The Collection</h2>
    </div>
    <span class="section-number">02 / 02</span>
  </div>
  {% include pages/artwork/filters.html artwork_count=include.artworks.size %}
  <div class="artwork-collection-grid">
    {% for artwork in include.artworks %}
      {% include pages/artwork/artwork-card.html artwork=artwork context="collection" %}
    {% endfor %}
  </div>
</section>
