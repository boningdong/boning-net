<div class="artwork-filter-system">
  <div class="artwork-filters" role="group" aria-label="Filter artwork by medium">
    <button class="artwork-filter-pill active" type="button" data-artwork-filter data-filter="all" aria-pressed="true">All</button>
    <button class="artwork-filter-pill" type="button" data-artwork-filter data-filter="pencil" aria-pressed="false">Pencil</button>
    <button class="artwork-filter-pill" type="button" data-artwork-filter data-filter="charcoal" aria-pressed="false">Charcoal</button>
    <button class="artwork-filter-pill" type="button" data-artwork-filter data-filter="watercolor" aria-pressed="false">Watercolor</button>
  </div>
  <span class="artwork-result-count" role="status" aria-live="polite" data-artwork-result-count>{{ include.artwork_count }} works</span>
</div>
