<dialog class="artwork-viewer" id="artwork-viewer" aria-labelledby="artwork-viewer-title" aria-describedby="artwork-viewer-description" data-artwork-viewer>
  <div class="artwork-viewer-layout">
    <div class="artwork-viewer-media">
      <img alt="" data-artwork-viewer-image>
    </div>
    <div class="artwork-viewer-copy">
      <small data-artwork-viewer-meta></small>
      <h2 id="artwork-viewer-title" data-artwork-viewer-title>Artwork</h2>
      <p id="artwork-viewer-description">Shown at its full aspect ratio.</p>
      <button class="artwork-viewer-close" type="button" data-artwork-viewer-close>Close viewer</button>
    </div>
  </div>
</dialog>
