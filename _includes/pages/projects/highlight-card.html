<a class="highlight-card{% if include.primary %} highlight-card--primary{% endif %}" href="{{ include.project.url | relative_url }}" aria-label="View {{ include.project.title }}">
  {% include components/responsive-image.html src=include.project.cover preset="large_card" alt=include.project.title %}
  <div class="highlight-info">
    <small>{{ include.project.tags | first | replace: "-", " " }} · {{ include.project.date | date: "%Y" }}</small>
    <h3>{{ include.project.title }}</h3>
    <p>{{ include.project.subtitle }}</p>
  </div>
</a>
