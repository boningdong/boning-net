title: Boning's Page
email: boning.contact@gmail.com
description: >-
  Portfolio website for Boning Dong, featuring engineering projects, artwork,
  and professional experience.
baseurl: ""
url: "https://imboning.com"
github_username: boningdong

collections:
  artwork:
    output: false
  projects:
    output: true
    permalink: /:collection/:name
  tags:
    output: false
  experiences:
    output: false

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll_picture_tag

picture:
  source: ""
  output: generated
  ignore_missing_images: false

sass:
  sass-dir: _sass
  style: compressed

project_detail:
  default_hero: /assets/img/showcase/project-detail-defaults/night-instrument-expanded.png

exclude:
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - test/
  - vendor/
