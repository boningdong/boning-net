title: Boning's Page
email: boning.contact@gmail.com
description: >-
  Portfolio website for Boning Dong, featuring engineering projects, artwork,
  and professional experience.
baseurl: ""
url: "https://imboning.com"
github_username: boningdong

collections:
  artwork:
    output: false
  projects:
    output: true
    permalink: /:collection/:name
  tags:
    output: false
  experiences:
    output: false

markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

sass:
  sass-dir: _sass
  style: compressed

exclude:
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
